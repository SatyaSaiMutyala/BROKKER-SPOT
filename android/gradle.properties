# Sized for a 6GB-RAM machine. History of OOM crashes:
#   4G heap + 4G kotlin      -> Gradle daemon OOM-killed by the OS
#   2G heap + 1.5G kotlin    -> Gradle daemon JVM crash (G1 virtual space mmap)
#   1536m heap, in-process   -> Gradle survived, but the Dart VM then OOM'd
#                               during :app:compileFlutterBuildDebug
#   1024m heap / 320m metaspace, in-process kotlinc
#                            -> daemon died "after running out of JVM Metaspace"
#                               at :device_info_plus:compileDebugKotlin
#
# -Xmx and MaxMetaspaceSize are CEILINGS, not reservations — with SerialGC both
# commit lazily, so generous limits cost nothing at rest and only stop us from
# dying prematurely. Metaspace must be large: kotlinc runs inside this JVM and
# its class metadata alone needs well over 320m (that was crash #4).
# SerialGC instead of G1 — G1 reserves large native region/remembered-set
# structures up front, which is what failed to mmap in crash #2.
# No HeapDumpOnOutOfMemoryError: it wrote a 1.4GB .hprof on each crash.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Run kotlinc inside the Gradle daemon rather than forking a second JVM.
# 8 bundled plugins apply KGP, so there IS real Kotlin compilation here — but
# one JVM with a big metaspace still beats two JVMs on a 6GB machine, since a
# separate Kotlin daemon costs its own ~200MB of base overhead plus metaspace.
kotlin.compiler.execution.strategy=in-process

# Keep concurrency low so we never have several memory-hungry workers at once.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
# All Flutter plugins in this project are AndroidX-native; Jetifier is the
# big memory hog (loads every dep JAR into RAM to rewrite android.support.*
# refs) and is what crashed the daemon last time.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
