# Sized for a 5GB-RAM machine — total Java heap ceiling = 2G + 1.5G = 3.5G,
# leaving headroom for Windows + IDE. The original 4G/4G config caused the
# OS to OOM-kill the daemon.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# All Flutter plugins in this project are AndroidX-native; Jetifier is the
# big memory hog (loads every dep JAR into RAM to rewrite android.support.*
# refs) and is what crashed the daemon last time.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
